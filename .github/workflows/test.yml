name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is checked in, so hashFiles is stable across runs. Cache
      # the whole target dir per OS to keep the ~59-crate dep graph from
      # rebuilding on every CI run; a stale restore just recompiles the diff.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The plugin loader test (zeus-agent) loads a real compiled dylib from
      # the top-level target/<profile> dir; only an explicit `cargo build`
      # emits that artifact (cargo test only builds hashed deps/ copies).
      - name: Build example plugin
        run: cargo build -p zeus-example-plugin

      - name: Run tests
        run: cargo test --workspace