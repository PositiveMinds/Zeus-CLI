name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # sccache shares compiled artifacts across CI runs via an OS-local
      # cache, so the ~59-crate dep graph only really compiles once per OS
      # even when Cargo.lock changes (the per-commit rebuild churn that the
      # old full target-dir cache didn't help with). This is the main driver
      # of the "Test" job wall-clock time.
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Configure sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Compiled artifacts come from sccache above; this cache only keeps the
      # downloaded crate sources so a cold Cargo.lock doesn't re-download the
      # whole registry. Deliberately NOT the target dir — sccache owns that
      # (per-CPU fingerprints churn every commit and tarring target/ cargo-vs-
      # sccache races to the same lock).
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-registry-

      # The plugin loader test (zeus-agent) loads a real compiled dylib from
      # the top-level target/<profile> dir; only an explicit `cargo build`
      # emits that artifact (cargo test only builds hashed deps/ copies).
      - name: Build example plugin
        run: cargo build -p zeus-example-plugin

      - name: Run tests
        run: cargo test --workspace

      # Style/lint are cheap to add on every matrix OS and keep a mis-format
      # or lint from slipping through on any platform.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings