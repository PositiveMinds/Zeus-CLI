name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # sccache shares compiled artifacts across CI runs via an OS-local
      # cache, so the ~59-crate dep graph only really compiles once per OS
      # even when Cargo.lock changes (the per-commit rebuild churn that the
      # old full target-dir cache didn't help with). This is the main driver
      # of the "Test" job wall-clock time.
      #
      # The GitHub Actions cache service occasionally has incidents where the
      # backend is unreachable; sccache then fails at server startup on *every*
      # rustc invocation. sccache is only an optimization, so we tolerate a
      # down cache: the action step is non-fatal, and the probe below only
      # wires sccache into cargo when its backend actually answers.
      - name: Enable sccache (optional)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Configure sccache for cargo
        shell: bash
        run: |
          export SCCACHE_GHA_ENABLED=true
          # Faithful probe: `--show-stats` soft-fails (exits 0) when the GHA
          # cache backend is down, so instead compile a trivial crate through
          # sccache exactly the way cargo will. Only wire the wrapper in when
          # that actually works; otherwise build without cache.
          tmp="$(mktemp -d)"
          echo 'fn main(){}' > "$tmp/t.rs"
          if sccache rustc --crate-type bin "$tmp/t.rs" -o "$tmp/t" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "using sccache"
          else
            echo "sccache cache backend unavailable (GH Actions cache incident?) — building without sccache"
          fi

      # Compiled artifacts come from sccache above; this cache only keeps the
      # downloaded crate sources so a cold Cargo.lock doesn't re-download the
      # whole registry. Deliberately NOT the target dir — sccache owns that
      # (per-CPU fingerprints churn every commit and tarring target/ cargo-vs-
      # sccache races to the same lock).
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-registry-

      # The plugin loader test (zeus-agent) loads a real compiled dylib from
      # the top-level target/<profile> dir; only an explicit `cargo build`
      # emits that artifact (cargo test only builds hashed deps/ copies).
      - name: Build example plugin
        run: cargo build -p zeus-example-plugin

      - name: Run tests
        run: cargo test --workspace

      # Style/lint are cheap to add on every matrix OS and keep a mis-format
      # or lint from slipping through on any platform.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings