[workspace]
resolver = "2"
members = [
    "crates/zeus-agent",
    "crates/zeus-cli",
    "crates/zeus-config",
    "crates/zeus-example-plugin",
    "crates/zeus-fs",
    "crates/zeus-lang",
    "crates/zeus-logging",
    "crates/zeus-provider",
    "crates/zeus-rag",
]
default-members = ["crates/zeus-cli"]

# Zeus ships as a downloaded binary (see install.ps1/install.bat), so release
# build size and steady-state speed matter more than release build time.
# `thin` LTO gets most of full LTO's cross-crate inlining/dead-code-elimination
# benefit for meaningfully less compile time than `fat`; `codegen-units = 1`
# lets the optimizer see the whole crate at once instead of parallel chunks
# (slower build, better codegen); `strip` drops debug symbols the shipped
# binary has no use for. `panic` is left at the default `unwind` — the TUI's
# terminal-restore cleanup in `tui::run` isn't panic-safe either way (it's
# plain sequential code after the `await`, not a Drop guard), so `abort`
# wouldn't clearly help and would change unwind-dependent cleanup elsewhere
# in the workspace (temp files, mutex guards) with no time to audit it here.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
authors = ["zeus contributors"]
repository = "https://github.com/PositiveMinds/Zeus-CLI"

[workspace.dependencies]
zeus-agent = { path = "crates/zeus-agent" }
zeus-config = { path = "crates/zeus-config" }
zeus-fs = { path = "crates/zeus-fs" }
zeus-lang = { path = "crates/zeus-lang" }
zeus-logging = { path = "crates/zeus-logging" }
zeus-provider = { path = "crates/zeus-provider" }
zeus-rag = { path = "crates/zeus-rag" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tempfile = "3"
base64 = "0.22"
zip = "2"
arboard = "3"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "plist-load",
] }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
