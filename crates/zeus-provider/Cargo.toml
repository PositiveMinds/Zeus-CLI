[package]
name = "zeus-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider-agnostic LLM interface for zeus"

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
zeus-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
# Pinned to 0.13.x (not the floating 0.13): all three crates that use reqwest
# must agree on the resolved version so the OpenSSL-free `rustls` transport,
# blocking feature gating, and any security fixes behave identically everywhere.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
dirs.workspace = true
zip = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
