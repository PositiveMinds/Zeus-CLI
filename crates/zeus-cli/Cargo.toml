[package]
name = "zeus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform CLI for the zeus coding agent"
default-run = "zeus"

[[bin]]
name = "zeus"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
zeus-agent = { workspace = true }
zeus-config = { workspace = true }
zeus-fs = { workspace = true }
zeus-lang = { workspace = true }
zeus-logging = { workspace = true }
zeus-provider = { workspace = true }
zeus-rag = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anstyle = "1.0.14"
toml.workspace = true
serde.workspace = true
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
syntect = { workspace = true }
arboard = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
