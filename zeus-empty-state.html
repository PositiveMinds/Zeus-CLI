<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zeus — Empty State</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #080b13;
    --ink-deep:   #05070d;
    --text:       #e8eefb;
    --muted:      #8290ad;
    --faint:      #566180;
    --line:       rgba(255,255,255,.08);
    --glass:      rgba(255,255,255,.028);
    --teal:       #57efce;
    --cyan:       #58c0ff;
    --violet:     #9d8cff;
    --gold:       #f2c661;
    --gold-soft:  #f6d98a;
    --display: "Space Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--display);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* animated network sits behind everything */
  #net { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* radial veil: keeps the center legible without hiding the network */
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(46% 38% at 50% 45%,
        rgba(5,7,13,.72) 0%,
        rgba(5,7,13,.5) 38%,
        rgba(5,7,13,.12) 70%,
        rgba(5,7,13,0) 84%),
      radial-gradient(120% 100% at 50% 118%, rgba(5,7,13,.55), rgba(5,7,13,0) 55%);
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    padding: 6vh 24px;
    gap: 0;
  }

  /* status eyebrow */
  .status {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--mono);
    font-size: 11px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 30px;
  }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(87,239,206,.55);
    animation: ping 2.6s ease-out infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(87,239,206,.5); }
    70%  { box-shadow: 0 0 0 7px rgba(87,239,206,0); }
    100% { box-shadow: 0 0 0 0 rgba(87,239,206,0); }
  }

  .wordmark {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.6rem, 8vw, 4.4rem);
    letter-spacing: -.015em;
    line-height: 1;
    background: linear-gradient(100deg, #eef3ff 0%, var(--gold-soft) 52%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .question {
    margin: 18px 0 40px;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1rem, 2.4vw, 1.22rem);
    color: var(--muted);
    letter-spacing: -.01em;
  }

  /* composer */
  .composer {
    display: flex; align-items: center; gap: 10px;
    width: min(560px, 88vw);
    padding: 14px 14px 14px 18px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -24px rgba(0,0,0,.7);
    transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
  }
  .composer:focus-within {
    border-color: rgba(87,239,206,.4);
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset,
                0 0 0 1px rgba(87,239,206,.25),
                0 24px 70px -22px rgba(0,0,0,.7);
  }
  .composer .glyph {
    font-family: var(--mono);
    color: var(--teal);
    font-size: 16px; line-height: 1;
    opacity: .9;
    user-select: none;
  }
  .composer input {
    flex: 1;
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px; letter-spacing: -.01em;
    caret-color: var(--teal);
  }
  .composer input::placeholder { color: var(--faint); }
  .send {
    display: grid; place-items: center;
    width: 34px; height: 34px; flex: none;
    border: 0; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.05);
    color: var(--muted);
    transition: background .2s ease, color .2s ease, transform .15s ease, opacity .2s;
  }
  .send:hover { color: var(--text); background: rgba(255,255,255,.09); }
  .send:active { transform: scale(.94); }
  .send.ready {
    background: linear-gradient(120deg, var(--teal), var(--cyan));
    color: #051018;
  }
  .send svg { width: 16px; height: 16px; }

  /* example chips */
  .chips {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    width: min(560px, 88vw);
    margin-top: 16px;
  }
  .chip {
    font-family: var(--mono); font-size: 12px;
    color: var(--muted);
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .chip:hover {
    color: var(--text);
    border-color: rgba(255,255,255,.18);
    background: rgba(255,255,255,.03);
  }

  .hint {
    margin-top: 26px;
    font-family: var(--mono); font-size: 11px;
    color: var(--faint); letter-spacing: .04em;
  }
  .hint kbd {
    font-family: var(--mono);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 10.5px;
  }

  :focus-visible { outline: 2px solid rgba(87,239,206,.6); outline-offset: 3px; }

  /* fullscreen toggle */
  .fs {
    position: fixed; top: 18px; right: 18px; z-index: 5;
    display: grid; place-items: center;
    width: 36px; height: 36px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--glass); color: var(--muted);
    cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: color .2s, border-color .2s, background .2s, opacity .3s;
  }
  .fs:hover { color: var(--text); border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.05); }
  .fs svg { width: 16px; height: 16px; }

  /* keep text crisp over the moving network */
  .status, .question, .hint { text-shadow: 0 1px 12px rgba(5,7,13,.9); }
  .wordmark { text-shadow: 0 2px 30px rgba(5,7,13,.8); }

  @media (max-width: 680px) {
    .veil {
      background:
        radial-gradient(72% 42% at 50% 46%,
          rgba(5,7,13,.85) 0%, rgba(5,7,13,.6) 42%,
          rgba(5,7,13,.15) 74%, rgba(5,7,13,0) 90%),
        linear-gradient(rgba(5,7,13,.35), rgba(5,7,13,.35));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .status .dot { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="veil"></div>

  <button class="fs" id="fs" aria-label="Enter full screen" title="Full screen (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
    </svg>
  </button>

  <main class="stage">
    <div class="status"><span class="dot"></span> Zeus ready</div>

    <h1 class="wordmark">Zeus</h1>
    <p class="question">What are we building?</p>

    <div class="composer" role="group" aria-label="Describe your task">
      <span class="glyph" aria-hidden="true">&rsaquo;</span>
      <input id="prompt" type="text" autocomplete="off" spellcheck="false"
             placeholder="Describe a task, or paste a file path…" aria-label="Task description" />
      <button class="send" id="send" aria-label="Start">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <div class="chips" id="chips">
      <button class="chip">Scaffold a new API</button>
      <button class="chip">Explain this codebase</button>
      <button class="chip">Write tests for a file</button>
    </div>

    <p class="hint"><kbd>Enter</kbd> to start &nbsp;·&nbsp; <kbd>Esc</kbd> to clear</p>
  </main>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const PAL = {
    line:   "137,151,190",   // resting edge (rgb)
    node:   "210,240,255",
    teal:   "87,239,206",
    cyan:   "88,192,255",
    violet: "157,140,255",
    gold:   "242,198,97",
  };
  const LAYERS_WIDE = [3, 5, 6, 5, 3];
  const LAYERS_NARROW = [2, 3, 3, 2];

  let W, H, dpr, nodes = [], edges = [], LAYERS = LAYERS_WIDE;
  const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false };
  let burst = 0; // brief pulse acceleration after submit

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build() {
    nodes = [];
    const narrow = W < 680;
    LAYERS = narrow ? LAYERS_NARROW : LAYERS_WIDE;
    const mx = W * (narrow ? 0.14 : 0.10), my = H * (narrow ? 0.08 : 0.13);
    const uw = W - mx * 2, uh = H - my * 2;
    LAYERS.forEach((count, li) => {
      const layer = [];
      const x = mx + (LAYERS.length === 1 ? .5 : li / (LAYERS.length - 1)) * uw;
      for (let n = 0; n < count; n++) {
        const y = my + (count === 1 ? .5 : n / (count - 1)) * uh;
        layer.push({ x, y, bx: x, by: y, phase: Math.random() * 6.28, li });
      }
      nodes.push(layer);
    });

    edges = [];
    for (let li = 0; li < nodes.length - 1; li++)
      for (const a of nodes[li])
        for (const b of nodes[li + 1])
          edges.push({
            a, b,
            phase: Math.random() * 6.28,
            bend: 0.5 + Math.random() * 1.3,
            speed: 0.5 + Math.random() * 0.7,
            pulse: Math.random(),
            pspeed: 0.14 + Math.random() * 0.18,
            hue: Math.random(),        // 0 → teal, 1 → violet
            gold: Math.random() < 0.15, // occasional warm spark
          });
  }

  function mix(t) { // teal → cyan → violet ramp
    const a = [87,239,206], b = [88,192,255], c = [157,140,255];
    let r, g, bl;
    if (t < 0.5) { const k = t/0.5; r=a[0]+(b[0]-a[0])*k; g=a[1]+(b[1]-a[1])*k; bl=a[2]+(b[2]-a[2])*k; }
    else { const k=(t-0.5)/0.5; r=b[0]+(c[0]-b[0])*k; g=b[1]+(c[1]-b[1])*k; bl=b[2]+(c[2]-b[2])*k; }
    return [r|0, g|0, bl|0];
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    // ease mouse
    mouse.x += (mouse.tx - mouse.x) * 0.08;
    mouse.y += (mouse.ty - mouse.y) * 0.08;
    if (burst > 0) burst *= 0.94;

    // gentle node drift + cursor attraction
    for (const layer of nodes) for (const nd of layer) {
      const dx = mouse.x - nd.bx, dy = mouse.y - nd.by;
      const d = Math.hypot(dx, dy);
      let ax = 0, ay = 0;
      if (mouse.active && d < 220) {
        const f = (1 - d / 220) * 14;
        ax = (dx / (d || 1)) * f; ay = (dy / (d || 1)) * f;
      }
      nd.x = nd.bx + Math.sin(t * 0.0006 + nd.phase) * 5 + ax;
      nd.y = nd.by + Math.cos(t * 0.0007 + nd.phase) * 5 + ay;
    }

    // resting edges
    ctx.lineWidth = 1;
    for (const e of edges) {
      const { a, b } = e;
      const ex = b.x - a.x, ey = b.y - a.y;
      const len = Math.hypot(ex, ey) || 1;
      const nx = -ey / len, ny = ex / len;
      const amp = e.bend * (10 + Math.sin(t * 0.0006 + e.phase) * 6);
      const steps = 26;

      ctx.beginPath();
      for (let s = 0; s <= steps; s++) {
        const p = s / steps;
        const env = Math.sin(p * Math.PI);
        const wave = Math.sin(p * 6.283 + t * 0.001 * e.speed + e.phase) * amp * env;
        const x = a.x + ex * p + nx * wave;
        const y = a.y + ey * p + ny * wave;
        s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = `rgba(${PAL.line},0.30)`;
      ctx.stroke();
    }

    // travelling signal pulses (additive)
    ctx.globalCompositeOperation = "lighter";
    for (const e of edges) {
      const { a, b } = e;
      const ex = b.x - a.x, ey = b.y - a.y;
      const len = Math.hypot(ex, ey) || 1;
      const nx = -ey / len, ny = ex / len;
      const amp = e.bend * (10 + Math.sin(t * 0.0006 + e.phase) * 6);

      const spd = e.pspeed * (1 + burst * 0.05);
      const pp = (e.pulse + t * 0.001 * spd) % 1;
      const env = Math.sin(pp * Math.PI);
      const wave = Math.sin(pp * 6.283 + t * 0.001 * e.speed + e.phase) * amp * env;
      const px = a.x + ex * pp + nx * wave;
      const py = a.y + ey * pp + ny * wave;

      const [r, g, bl] = e.gold ? [242,198,97] : mix(e.hue);
      const glow = 12 + burst * 0.5;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, glow);
      grad.addColorStop(0, `rgba(${r},${g},${bl},${1.0 * (0.55 + env * 0.45)})`);
      grad.addColorStop(0.4, `rgba(${r},${g},${bl},${0.35 * (0.55 + env * 0.45)})`);
      grad.addColorStop(1, `rgba(${r},${g},${bl},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, glow, 0, 6.2832);
      ctx.fill();
    }

    // nodes
    for (const layer of nodes) for (const nd of layer) {
      const pulse = 0.6 + 0.4 * Math.sin(t * 0.0015 + nd.phase);
      const near = mouse.active
        ? Math.max(0, 1 - Math.hypot(mouse.x - nd.x, mouse.y - nd.y) / 200) : 0;
      const R = 2.4 + pulse * 1.2 + near * 2;

      const g1 = ctx.createRadialGradient(nd.x, nd.y, 0, nd.x, nd.y, R * 6);
      g1.addColorStop(0, `rgba(${PAL.teal},${0.16 + near * 0.25})`);
      g1.addColorStop(1, `rgba(${PAL.teal},0)`);
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, R * 6, 0, 6.2832); ctx.fill();

      ctx.fillStyle = `rgba(${PAL.node},${0.75 + near * 0.25})`;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, R, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  let raf;
  function loop(t) { frame(t); raf = requestAnimationFrame(loop); }

  // ---- interactions ----
  window.addEventListener("resize", resize);
  window.addEventListener("pointermove", e => {
    mouse.tx = e.clientX; mouse.ty = e.clientY; mouse.active = true;
  });
  window.addEventListener("pointerleave", () => { mouse.active = false; mouse.tx = -9999; mouse.ty = -9999; });

  const input = document.getElementById("prompt");
  const send = document.getElementById("send");
  const chips = document.getElementById("chips");

  const refresh = () => send.classList.toggle("ready", input.value.trim().length > 0);
  input.addEventListener("input", refresh);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") submit();
    if (e.key === "Escape") { input.value = ""; refresh(); }
  });
  send.addEventListener("click", submit);
  chips.addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    input.value = c.textContent.trim();
    refresh(); input.focus();
  });

  function submit() {
    if (!input.value.trim()) { input.focus(); return; }
    burst = 20; // network surges forward
    // hook: dispatch input.value to your agent here
    input.select();
  }

  // ---- fullscreen ----
  const fsBtn = document.getElementById("fs");
  const ICON_EXPAND = 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3';
  const ICON_COLLAPSE = 'M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3';
  const inFS = () => document.fullscreenElement || document.webkitFullscreenElement;

  async function toggleFS() {
    try {
      if (!inFS()) {
        const el = document.documentElement;
        await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen?.());
      } else {
        await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen?.());
      }
    } catch (_) { /* denied or unsupported */ }
  }
  function syncFS() {
    const on = !!inFS();
    fsBtn.querySelector("path").setAttribute("d", on ? ICON_COLLAPSE : ICON_EXPAND);
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Enter full screen");
  }
  fsBtn.addEventListener("click", toggleFS);
  document.addEventListener("fullscreenchange", syncFS);
  document.addEventListener("webkitfullscreenchange", syncFS);
  window.addEventListener("keydown", e => {
    if ((e.key === "f" || e.key === "F") && document.activeElement !== input && !e.metaKey && !e.ctrlKey) {
      e.preventDefault(); toggleFS();
    }
  });

  resize();
  if (reduce) { frame(1200); }      // one static, composed frame
  else { raf = requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
